[project]
name = "folium-workspace"
version = "0.1.0"
description = "Folium Python workspace"
requires-python = ">=3.13,<3.14"
dependencies = ["folium_runtime"]

[tool.uv]
keyring-provider = "subprocess"

[tool.uv.sources]
folium_runtime = { workspace = true }

[tool.uv.workspace]
members = [
    "backend",
    "e2e",
    "packages/folium-core",
    "services/summarize",
    "services/transcribe",
    "services/chartreview",
    "services/voicenotes",
    "tools/favicon_generator",
    "tools/folium_runtime",
]

[dependency-groups]
dev = [
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-shadcn>=0.12.1",
]
