services:
  southdrift-backend:
    container_name: southdrift-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    depends_on:
      southdrift-postgres:
        condition: service_healthy
      southdrift-minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Development settings
      - PYTHONUNBUFFERED=1
      - RELOAD=true

      # Database configuration
      - DATABASE_URL=postgresql+asyncpg://southdrift:dev_password_change_in_prod@southdrift-postgres:5432/southdrift_db

      # Storage configuration (MinIO)
      - STORAGE_ENDPOINT=http://southdrift-minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=southdrift-dev
      - STORAGE_REGION=us-east-1

      # Microservices URLs
      - TRANSCRIPTION_SERVICE_URL=http://southdrift-transcribe:8001
      - SUMMARIZATION_SERVICE_URL=http://southdrift-summarize:8002

      # Temporal
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    volumes:
      - backend_cache:/root/.cache
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
        - action: rebuild
          path: pyproject.toml

volumes:
  backend_cache:
