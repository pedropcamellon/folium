services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD=true
    volumes:
      - backend_cache:/root/.cache
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
        - action: rebuild
          path: pyproject.toml

volumes:
  backend_cache:
