services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Development settings
      - PYTHONUNBUFFERED=1
      - RELOAD=true

      # Database configuration
      - DATABASE_URL=postgresql+asyncpg://southdrift:dev_password_change_in_prod@postgres:5432/southdrift_db

      # Storage configuration (MinIO)
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=southdrift-dev
      - STORAGE_REGION=us-east-1

      # Microservices URLs
      - TRANSCRIPTION_SERVICE_URL=http://transcribe:8001
      - SUMMARIZATION_SERVICE_URL=http://summarize:8002

      # Temporal
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    volumes:
      - backend_cache:/root/.cache
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
        - action: rebuild
          path: pyproject.toml

volumes:
  backend_cache:
