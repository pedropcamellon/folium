name: Demo pipeline

on:
  push:
    paths:
      - frontend/**
      - infrastructure/azure/demo/**
      - infrastructure/azure/modules/resource_group/**
      - .github/workflows/demo-*.yml
  pull_request:
    paths:
      - frontend/**
      - infrastructure/azure/demo/**
      - infrastructure/azure/modules/resource_group/**
      - .github/workflows/demo-*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pipeline-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    uses: ./.github/workflows/demo-validate.yml

  infra:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/demo-infra.yml

  deploy:
    needs: [validate, infra]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/demo-deploy.yml
