name: E2E Pull Request Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E (all scenarios)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      COMPOSE_PROJECT_NAME: folium-e2e-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install E2E dependencies
        run: uv sync --directory e2e --locked

      - name: Install Playwright Chromium
        run: uv run --directory e2e --locked playwright install --with-deps chromium

      - name: Configure ephemeral CI services
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=folium
          POSTGRES_PASSWORD=folium-ci-postgres
          TEMPORAL_POSTGRES_PASSWORD=folium-ci-temporal
          JWT_SECRET=folium-ci-only-jwt-secret
          CHARTREVIEW_INTERNAL_TOKEN=folium-ci-chartreview-token
          CHARTREVIEW_EVALUATION_TOKEN=folium-ci-evaluation-token
          STORAGE_ACCESS_KEY=folium-ci
          STORAGE_SECRET_KEY=folium-ci-only-storage-secret
          STORAGE_BUCKET=folium-dev
          EOF

      - name: Start backend, frontend, database, storage, and Temporal
        run: >-
          docker compose up --build --detach --wait --wait-timeout 300
          folium-postgres folium-rustfs folium-backend frontend
          folium-temporal-postgres folium-temporal

      - name: Start X-ray review inference
        run: >-
          docker compose up --build --detach --wait --wait-timeout 600
          folium-xray-review

      - name: Seed E2E users and fixtures
        run: docker compose exec --no-TTY folium-backend python -m app.seed_db

      - name: Start deterministic chart-review model mock
        run: |
          docker run --detach \
            --name folium-e2e-chartreview-mock \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --network-alias folium-summarize \
            --publish 8002:8002 \
            --volume "$GITHUB_WORKSPACE/e2e/ci/mock_chart_review_ai.py:/app/mock_chart_review_ai.py:ro" \
            python:3.13-slim \
            python /app/mock_chart_review_ai.py
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8002/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Chart-review mock did not become healthy within 30 seconds."
          exit 1

      - name: Start chart-review worker
        run: >-
          docker compose up --build --detach --wait --wait-timeout 120
          --no-deps folium-chartreview-worker

      - name: Run all E2E scenarios
        env:
          PLAYWRIGHT_HEADLESS: "true"
          FOLIUM_STORAGE_ACCESS_KEY: folium-ci
          FOLIUM_STORAGE_SECRET_KEY: folium-ci-only-storage-secret
          FOLIUM_STORAGE_ENDPOINT: http://localhost:9000
          FOLIUM_STORAGE_BUCKET: folium-dev
        run: uv run --directory e2e --locked ./main.py

      - name: Collect service logs
        if: always()
        run: |
          docker compose logs --no-color > e2e-compose-logs.txt 2>&1
          if docker container inspect folium-e2e-chartreview-mock >/dev/null 2>&1; then
            docker logs folium-e2e-chartreview-mock > e2e-chartreview-mock.log 2>&1
          fi

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            e2e-compose-logs.txt
            e2e-chartreview-mock.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Compose services
        if: always()
        run: |
          if docker container inspect folium-e2e-chartreview-mock >/dev/null 2>&1; then
            docker rm --force folium-e2e-chartreview-mock
          fi
          docker compose down --volumes --remove-orphans
