name: Deploy frontend demo

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/deployment.md
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: ""
          production_branch: main
        env:
          NEXT_PUBLIC_API_MODE: mock

      - name: Update documented production demo URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEMO_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "docs/deployment.md";
          const url = process.env.DEMO_URL;
          if (!url || !/^https:\/\/[a-z0-9-]+\.azurestaticapps\.net\/?$/i.test(url)) {
            throw new Error("Azure Static Web Apps did not return a valid production URL.");
          }
          const content = fs.readFileSync(file, "utf8");
          const updated = content.replace(
            /<!-- demo-url:start -->[\s\S]*?<!-- demo-url:end -->/,
            `<!-- demo-url:start -->\n[${url}](${url})\n<!-- demo-url:end -->`
          );
          if (updated === content) {
            throw new Error("Could not find the demo URL markers in docs/deployment.md.");
          }
          fs.writeFileSync(file, updated);
          NODE

      - name: Commit demo URL update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/deployment.md; then
            echo "Demo URL is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment.md
          git commit -m "docs: update deployed demo URL"
          git push

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: frontend
