name: Demo infra

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: azure-demo
    defaults:
      run:
        working-directory: infrastructure/azure/demo
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_enable_app_service_demo: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize remote state
        run: terraform init -input=false
      - name: Validate
        run: terraform validate
      - name: Plan Free F1 environment
        run: terraform plan -input=false -out=tfplan
      - name: Apply Free F1 environment
        run: terraform apply -input=false -auto-approve tfplan
