site_name: Folium Documentation
site_description: Local-first documentation for Folium's synthetic, reviewable chart-support workflows.
site_url: https://pedropcamellon.github.io/folium/docs/
repo_url: https://github.com/pedropcamellon/folium
repo_name: pedropcamellon/folium
edit_uri: edit/main/docs/

theme:
  name: shadcn
  language: en
  accent: "oklch(0.488 0.243 264.376)"
  show_stargazers: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit

extra_css:
  - stylesheets/folium-theme.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

strict: true

nav:
  - Home: README.md
  - User guide:
      - Overview: user-guide/index.md
      - Synthetic patients and interactions: user-guide/patients-and-interactions.md
      - Voice-note processing: user-guide/voice-notes.md
      - Chart-review drafts: user-guide/chart-review.md
      - Lifecycle, citations, and review flags: user-guide/lifecycle-citations-and-flags.md
  - Developer guide:
      - Overview: dev/index.md
      - AIOps architecture: dev/aiops-architecture.md
      - Offline evaluation: dev/aiops-offline-evaluation.md
      - Online evaluation: dev/aiops-online-evaluation.md
      - Local Docker runtime: dev/local-development.md
      - Service and contract boundaries: dev/architecture-and-contracts.md
      - Bounded chart-review agent: dev/chart-review-agent.md
      - Chart-review evaluation: dev/chart-review-evaluation.md
      - Chart-review experiments: dev/chart-review-experiments.md
      - Validation and offline evaluation: dev/validation-and-evals.md
      - MLflow evidence and Temporal audit: dev/mlflow-and-temporal.md
      - Observability: dev/observability.md
      - Safe extension: dev/safe-extension.md
      - Clinical data model: dev/clinical-data-model.md
      - Clinical data migration: dev/clinical-data-migration.md
      - Local LLM build compatibility: dev/local-llm-builds.md

extra:
  generator: false

copyright: Folium is a personal, local-first engineering sandbox. It is not a complete EHR.
