site_name: folium
site_description: A modern clinical workflow platform that reduces administrative burden and helps care teams focus on individualized, clinician-led care.
site_url: https://pedropcamellon.github.io/folium/
repo_url: https://github.com/pedropcamellon/folium
repo_name: pedropcamellon/folium
edit_uri: edit/main/docs/

theme:
  name: shadcn
  language: en
  # logo: assets/logo-icon.png
  favicon: assets/favicon-32x32.png
  accent: "oklch(0.488 0.243 264.376)"
  show_stargazers: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit

extra_css:
  - stylesheets/folium-theme.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - literate-nav

strict: true

nav:
  - folium: README.md
  - Help Center: user-guide/
  - Developers: dev/

extra:
  generator: false

copyright: Folium is a personal, local-first engineering sandbox. It is not a complete EHR.
