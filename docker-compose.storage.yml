services:
  folium-rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: folium-rustfs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    env_file:
      - path: .env
        required: false
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in root .env}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in root .env}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  rustfs_data:
