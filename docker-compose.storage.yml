services:
  minio:
    image: minio/minio:latest
    container_name: southdrift-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    env_file:
      - .env.storage
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:
