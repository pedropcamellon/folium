include:
  - docker-compose.database.yml
  - docker-compose.storage.yml
  - backend/docker-compose.yml
  - frontend/docker-compose.yml
  - services/transcribe/docker-compose.yml
  - services/summarize/docker-compose.yml

services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - south-drift-network

  frontend:
    networks:
      - south-drift-network

  postgres:
    networks:
      - south-drift-network

  minio:
    networks:
      - south-drift-network

  transcribe:
    networks:
      - south-drift-network

  summarize:
    networks:
      - south-drift-network

networks:
  south-drift-network:
    driver: bridge
