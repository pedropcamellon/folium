services:
  southdrift-temporal-postgres:
    image: postgres:15-alpine
    container_name: southdrift-temporal-postgres
    ports:
      - "5433:5432" # Use 5433 externally to avoid conflict with app postgres
    env_file:
      - .env
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    container_name: southdrift-temporal-server
    ports:
      - "7233:7233"
    env_file:
      - .env
    environment:
      - POSTGRES_SEEDS=southdrift-temporal-postgres
    depends_on:
      southdrift-temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: southdrift-temporal-ui
    ports:
      - "8233:8080"
    env_file:
      - .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  temporal-postgres-data:
