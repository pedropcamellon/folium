services:
  folium-temporal-postgres:
    image: postgres:15-alpine
    container_name: folium-temporal-postgres
    ports:
      - "5433:5432" # Use 5433 externally to avoid conflict with app postgres
    env_file:
      - path: ../../.env
        required: false
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD in root .env}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  folium-temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: folium-temporal-server
    ports:
      - "7233:7233"
      - "9464:8000" # Prometheus metrics; avoids the backend host port 8000.
    env_file:
      - path: ../../.env
        required: false
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD in root .env}
      POSTGRES_SEEDS: folium-temporal-postgres
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    depends_on:
      folium-temporal-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "tctl",
          "--address",
          "folium-temporal:7233",
          "cluster",
          "health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  folium-temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: folium-temporal-ui
    ports:
      - "8233:8080"
    env_file:
      - path: ../../.env
        required: false
    environment:
      TEMPORAL_ADDRESS: folium-temporal:7233
    depends_on:
      - folium-temporal

volumes:
  temporal-postgres-data:
