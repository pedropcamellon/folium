services:
  folium-voicenotes-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folium-voicenotes-worker
    depends_on:
      folium-backend:
        condition: service_healthy
      folium-summarize:
        condition: service_healthy
      folium-temporal:
        condition: service_healthy
      folium-transcribe:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - TEMPORAL_ADDRESS=folium-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - VOICE_NOTE_TASK_QUEUE=voice-notes-queue
      - BACKEND_API_URL=http://folium-backend:8000
      - TRANSCRIPTION_SERVICE_URL=http://folium-transcribe:8001
      - SUMMARIZATION_SERVICE_URL=http://folium-summarize:8002
      - LOG_LEVEL=INFO
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
        - action: rebuild
          path: pyproject.toml
