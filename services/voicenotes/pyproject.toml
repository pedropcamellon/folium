[project]
name = "voicenotes"
version = "0.1.0"
description = "Temporal worker service for SouthDrift voice note processing"
readme = "README.md"
requires-python = "==3.11.15"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "temporalio==1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.0",
    "ruff==0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"