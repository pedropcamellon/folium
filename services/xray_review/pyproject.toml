[project]
name = "folium-xray-review"
version = "0.1.0"
description = "Separately deployable, research-only chest X-ray classification adapter"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.26.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.12",
    "safetensors>=0.4.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
