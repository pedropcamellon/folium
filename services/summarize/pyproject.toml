[project]
name = "summarize"
version = "0.1.0"
description = "Clinical summarization microservice with Abstract Provider Pattern"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
openai = [
    "openai>=1.10.0"
]
aws = [
    "boto3>=1.34.0"
]
azure = [
    "azure-ai-inference>=1.0.0b1",
    "azure-identity>=1.15.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
