services:
  folium-summarize:
    image: folium-summarize:dev
    build:
      context: ../..
      dockerfile: services/summarize/Dockerfile
      args:
        PROVIDER: local # local, openai, bedrock, azure
    container_name: folium-summarize
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: summarize
      SERVICE_PORT: "8002"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SUMMARIZATION_PROVIDER: ${SUMMARIZATION_PROVIDER:-local}
      LOCAL_MODEL_PATH: ${LOCAL_MODEL_PATH:-/models/model.gguf}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-mediphi-clinical}
      LOCAL_N_CTX: ${LOCAL_N_CTX:-8192}
      LOCAL_N_THREADS: ${LOCAL_N_THREADS:-4}
      LOCAL_TEMPERATURE: ${LOCAL_TEMPERATURE:-0.0}
      LOCAL_MAX_TOKENS: ${LOCAL_MAX_TOKENS:-800}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://frontend:3000"]'

    volumes:
      # Mount local models directory (download GGUF model here)
      - ./models:/models

      # Development: Watch mode for hot reload
      - ./app:/workspace/services/summarize/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Allow time for model loading

    # Resource limits (CPU-only configuration)
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G
        reservations:
          cpus: "4.0"
          memory: 8G
