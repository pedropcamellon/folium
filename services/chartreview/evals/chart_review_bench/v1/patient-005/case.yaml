id: cad-longitudinal-nitroglycerin-response
title: Coronary artery disease (CAD) follow-up with recurrent exertional chest pressure
version: 1
description: Evaluates whether the agent retrieves a clinically relevant prior exertional chest-pressure episode, compares it with the current episode, preserves the undocumented current nitroglycerin response, and ignores unrelated history.

metadata:
  evaluation_pack: coronary-artery-disease-v1
  clinical_area: cardiovascular
  condition: coronary-artery-disease
  scenario: longitudinal-comparison

fixture:
  patient:
    key: patient-005
    age_at_active_encounter: 64
    date_of_birth: 1962-02-03
    gender: female
  encounters:
    - key: annual-exam-2025
      occurred_at: 2025-11-15T09:00:00Z
      title: Annual exam
      purpose: preventive
      summary: >
        Preventive visit records a clinic blood pressure of 126/78 mmHg.
      note: >
        Preventive visit records a clinic blood pressure of 126/78 mmHg.
    - key: cardiology-evaluation-2026
      occurred_at: 2026-04-10T14:00:00Z
      title: Cardiology evaluation for exertional chest pressure
      purpose: follow_up
      summary: >
        Patient reported chest pressure while climbing stairs that resolved
        within several minutes after rest and one prescribed 0.4 mg dose of
        sublingual nitroglycerin. An exercise stress test reproduced the chest
        pressure and documented ischemic ECG changes.
      note: >
        Patient reported chest pressure while climbing stairs that resolved
        within several minutes after rest and one prescribed 0.4 mg dose of
        sublingual nitroglycerin. An exercise stress test reproduced the chest
        pressure and documented ischemic ECG changes.
    - key: cad-follow-up-001
      occurred_at: 2026-11-15T10:30:00Z
      title: Coronary artery disease follow-up
      purpose: follow_up
      note: >
        Patient returns for coronary artery disease follow-up. Since the last
        visit, the patient had one five-minute episode of chest pressure while
        climbing stairs and used one prescribed 0.4 mg dose of sublingual
        nitroglycerin. No shortness of breath, palpitations, or dizziness
        occurred with the episode. No chest pain is reported today.
  active_encounter_key: cad-follow-up-001

expected:
  output:
    summary_facts:
      - coronary artery disease follow-up
      - chest pressure climbing stairs
      - five-minute episode
      - 0.4 mg nitroglycerin
      - no shortness of breath
      - no palpitations
      - no dizziness
      - no chest pain
      - chest pressure resolved rest
      - exercise stress test
      - ischemic ECG changes
    missing_information:
      - Response of the current symptoms to nitroglycerin is not documented.
    follow_up_questions:
      - Did the current symptoms improve after nitroglycerin?
    forbidden_claims:
      - The current symptoms improved after nitroglycerin.
      - Nitroglycerin did not improve the current symptoms.
      - The current episode was angina.
      - Coronary artery disease is worsening.
      - The current episode had ischemic ECG changes.
      - Medication dose was increased.
    required_follow_up_terms:
      - symptoms
      - improve
      - nitroglycerin
    forbidden_follow_up_terms:
      - prescribe
      - start
      - stop
      - increase
      - decrease
      - stress test
    required_source_roles:
      - active.note
      - cardiology-evaluation-2026.summary
    forbidden_source_roles:
      - annual-exam-2025.summary
    confidence: null
  history_decision:
    should_retrieve: true
    forbidden_search_terms:
      - blood pressure
      - treatment recommendation
      - medication change
    expected_returned_source_roles:
      - cardiology-evaluation-2026.summary
  validation:
    expected_status: valid
