      - Symptoms associated with exertional fatigue are not documented.
      - Whether the current exertional fatigue improves with rest is not documented.
    follow_up_questions:
      - When did the current exertional fatigue begin, how long does each episode last, and does it improve with rest?
      - How often does the exertional fatigue occur, and has it become more frequent or limiting?
      - What symptoms are associated with the fatigue, such as chest discomfort, shortness of breath, palpitations, dizziness, or sweating?
