id: hypertension-medication-reconciliation
version: 1
description: Office consultation documents elevated blood pressure in a patient with hypertension; annual exams provide prior medication context but current medication and adherence records remain unverified.

fixture:
  patient:
    key: patient-002
    age_at_active_encounter: 73
    date_of_birth: 1953-05-08
    gender: female
  encounters:
    - key: annual-exam-2024
      occurred_at: 2024-11-13T09:00:00Z
      title: Annual exam
      purpose: preventive
      summary: >
        Annual exam is normal. Hypertension is documented. Blood pressure is
        142/86 mmHg in clinic, and the patient reports lower readings at home.
    - key: annual-exam-2025
      occurred_at: 2025-11-13T09:00:00Z
      title: Annual exam
      purpose: preventive
      summary: >
        Annual exam is normal. Blood-pressure medication record lists
        lisinopril 10 mg each morning for hypertension. Patient reports
        medication adherence at this visit. Blood pressure is 140/84 mmHg in
        clinic, and the patient reports lower readings at home.
    - key: office-consultation-001
      occurred_at: 2026-11-13T10:30:00Z
      title: Office consultation
      purpose: initial
      note: >
        Patient presents for an office consultation. Blood pressure is 168/96
        mmHg and glucose is elevated today. Hypertension and diabetes are
        documented. The current blood-pressure medication record and whether
        medication is taken as scheduled are not available.
  active_encounter_key: office-consultation-001

expected:
  output:
    summary_facts:
      - Blood pressure is 168/96 mmHg.
      - Glucose is elevated.
      - Hypertension is documented.
      - Diabetes is documented.
    missing_information:
      - Current blood-pressure medication record is not available.
      - Whether medication is taken as scheduled is not available.
    follow_up_questions:
      - Does the patient take the prescribed blood-pressure medication as scheduled?
      - Which blood-pressure medications are currently taken?
    required_follow_up_terms:
      - blood pressure
      - medication
      - scheduled
    forbidden_follow_up_terms:
      - new symptoms
      - change
    required_source_roles:
      - active.note
    forbidden_source_roles: []
    confidence: null
  history_decision:
    should_retrieve: true
    forbidden_search_terms:
      - treatment
      - diabetes
    expected_returned_source_roles:
      - annual-exam-2025.summary
  validation:
    expected_status: valid
