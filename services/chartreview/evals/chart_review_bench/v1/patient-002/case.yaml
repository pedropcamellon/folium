id: cad-history-needed
title: CAD follow-up with prior stent and statin history
version: 1
description: CAD follow-up lacks a prior stent date and statin detail, which a bounded prior encounter lookup can supply.

metadata:
  evaluation_pack: coronary-artery-disease-v1
  clinical_area: cardiovascular
  condition: coronary-artery-disease
  scenario: history-needed

fixture:
  patient:
    key: patient-002
    age_at_active_encounter: 73
    date_of_birth: 1953-05-08
    gender: male
  encounters:
    - key: cardiology-follow-up-2025
      occurred_at: 2025-11-13T09:00:00Z
      title: Cardiology follow-up
      purpose: follow_up
      summary: >
        Coronary artery disease history includes a drug-eluting coronary stent
        placed in 2024. Atorvastatin 40 mg is documented at this visit.
    - key: cad-follow-up-001
      occurred_at: 2026-11-13T10:30:00Z
      title: CAD follow-up
      purpose: follow_up
      note: >
        Patient returns for coronary artery disease follow-up. No chest pain is
        reported today. Prior coronary stent date and prior statin detail are
        not available in the active encounter.
  active_encounter_key: cad-follow-up-001

expected:
  output:
    summary_facts:
      - Coronary artery disease follow-up is documented.
      - Chest pain is not reported today.
    missing_information:
      - Prior coronary stent date is not available in the active encounter.
      - Prior statin detail is not available in the active encounter.
    follow_up_questions:
      - Can the prior coronary stent date be confirmed?
      - Can the prior statin detail be confirmed?
    required_follow_up_terms:
      - stent
      - statin
    forbidden_follow_up_terms:
      - treatment
      - change
    required_source_roles:
      - active.note
    forbidden_source_roles: []
    confidence: null
  history_decision:
    should_retrieve: true
    forbidden_search_terms:
      - treatment
      - chest pain
    expected_returned_source_roles:
      - cardiology-follow-up-2025.summary
  validation:
    expected_status: valid
