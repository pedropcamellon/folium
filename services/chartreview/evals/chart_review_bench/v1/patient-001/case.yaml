id: cad-current-only
title: Coronary artery disease (CAD) follow-up with implicit assessment gaps
version: 1
description: Evaluates whether the agent identifies focused current-assessment gaps, asks clinically useful questions, and avoids unnecessary history retrieval when the active CAD encounter supplies sufficient context.

metadata:
  evaluation_pack: coronary-artery-disease-v1
  clinical_area: cardiovascular
  condition: coronary-artery-disease
  scenario: current-only

fixture:
  patient:
    key: patient-001
    age_at_active_encounter: 68
    date_of_birth: 1958-03-12
    gender: female
  encounters:
    - key: cad-follow-up-001
      occurred_at: 2026-11-12T10:00:00Z
      title: Coronary artery disease follow-up
      purpose: follow_up
      note: >
        Patient returns for coronary artery disease follow-up. No chest pain or
        shortness of breath at rest is reported today. The active medication
        list documents aspirin and atorvastatin. Blood pressure is 128/76 mmHg.
  active_encounter_key: cad-follow-up-001

expected:
  output:
    summary_facts:
      - coronary artery disease follow-up
      - no chest pain
      - no shortness of breath
      - aspirin
      - atorvastatin
      - blood pressure
      - 128/76
    missing_information:
      - Exertional symptoms are not documented.
      - Exercise tolerance is not documented.
      - Medication adherence is not documented.
      - Medication tolerance is not documented.
    follow_up_questions:
      - Has the patient experienced chest discomfort or shortness of breath with exertion?
      - What is the patient’s current exercise tolerance?
      - Is the patient taking and tolerating aspirin and atorvastatin as documented?
    forbidden_claims:
      - Coronary artery disease is worsening.
      - Coronary artery disease is stable.
      - Medication dose was increased.
    required_follow_up_terms:
      - exertion
      - exercise tolerance
      - taking
      - tolerating
    forbidden_follow_up_terms:
      - treatment
      - blood pressure
    required_source_roles:
      - active.note
    forbidden_source_roles: []
    confidence: null
  history_decision:
    should_retrieve: false
    expected_returned_source_roles: []
  validation:
    expected_status: valid
